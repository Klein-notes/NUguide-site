<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>裝置檢查</title>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<style>
  body { background:#100f18; color:#ece9f7; font: 15px/1.6 sans-serif; padding: 16px; }
  h1 { font-size: 1.1rem; color:#c9a45c; margin: 0 0 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  td { border-bottom: 1px solid #322f47; padding: 5px 4px; vertical-align: top; word-break: break-all; }
  td:first-child { color:#a29cbf; width: 46%; }
  .yes { color:#6fbf73; font-weight:700; } .no { color:#e2604f; font-weight:700; }
</style>
</head>
<body>
<h1>裝置檢查（請整頁截圖給我）</h1>
<table id="t"></table>
<div style="display:none"><span class="nav-label-short" id="probe">x</span></div>
<script>
(async () => {
  const rows = [];
  const add = (k, v) => rows.push([k, v]);
  const mq = (q) => matchMedia(q).matches;
  const yn = (b) => `<span class="${b ? 'yes' : 'no'}">${b ? '是' : '否'}</span>`;
  add('網站判斷為觸控模式', yn(mq('(hover: none) and (pointer: coarse)')));
  add('hover: none', yn(mq('(hover: none)')));
  add('hover: hover', yn(mq('(hover: hover)')));
  add('pointer: coarse', yn(mq('(pointer: coarse)')));
  add('pointer: fine', yn(mq('(pointer: fine)')));
  add('any-pointer: coarse', yn(mq('(any-pointer: coarse)')));
  add('any-hover: none', yn(mq('(any-hover: none)')));
  add('觸控點數 maxTouchPoints', navigator.maxTouchPoints);
  add('ontouchstart', yn('ontouchstart' in window));
  add('畫面寬 innerWidth', innerWidth + ' px（screen ' + screen.width + '）');
  add('像素比 devicePixelRatio', devicePixelRatio);
  add('短選單樣式實際套用', yn(getComputedStyle(document.getElementById('probe')).display !== 'none'));
  for (const [label, url, marker] of [
    ['Navbar.js（快取中的版本）', 'src/components/Navbar.js', 'nav-label-short'],
    ['components.css（快取中的版本）', 'assets/css/components.css', 'nav-label-short'],
  ]) {
    try {
      const cached = await (await fetch(url)).text();
      const fresh = await (await fetch(url + '?nocache=' + Date.now(), { cache: 'no-store' })).text();
      add(label, '快取版有新選單：' + yn(cached.includes(marker)) + '　伺服器最新版有新選單：' + yn(fresh.includes(marker)));
    } catch (e) { add(label, '讀取失敗 ' + e.message); }
  }
  add('瀏覽器 UA', navigator.userAgent);
  document.getElementById('t').innerHTML = rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
})();
</script>
</body>
</html>
