<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<style>html,body{background:#100f18;}</style>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新世界狂歡 | 關卡攻略筆記 | 玩家攻略站</title>
<link rel="icon" href="assets/img/site-icon/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/img/site-icon/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="assets/img/site-icon/icon-192.png" type="image/png" sizes="192x192">
<link rel="icon" href="assets/img/site-icon/icon-512.png" type="image/png" sizes="512x512">
<link rel="apple-touch-icon" href="assets/img/site-icon/apple-touch-icon.png" sizes="180x180">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/card-face.css">
<style>
/* 首頁三張卡片動態效果 (2026-09-11) — 只有這頁在用，直接寫在這裡，
   不放進共用的 components.css，兩個 repo 都不用跟著改。跟卡片本身的
   背景/邊框顏色(後台「首頁外觀」可調)完全獨立疊加，不會互相覆蓋。 */
.home-starfield { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.home-glow-star {
  position: absolute; width: 3px; height: 3px; border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 4px 1px rgba(255,255,255,0.9), 0 0 9px 3px rgba(159,197,255,0.5);
  animation: homeStarTwinkle 4s ease-in-out infinite;
}
@keyframes homeStarTwinkle {
  0%, 100% { opacity: 0.25; transform: scale(0.8); }
  50%      { opacity: 1;    transform: scale(1.3); }
}
#home-cards { position: relative; z-index: 1; }

.home-card {
  animation: homeCardIn 0.45s cubic-bezier(.2,.7,.3,1) forwards, homeBorderBreathe 5s ease-in-out infinite;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}
/* 進場動畫跑完後，JS 會把 homeCardIn 從 animation 清單裡拿掉，只留
   homeBorderBreathe。opacity/transform 的起始值刻意寫在 keyframes 的
   0% 裡，不寫成 .home-card 本身的固定樣式——不然動畫一拿掉，沒東西
   蓋過這個固定樣式，卡片又會彈回「看不見/位移」的狀態
   (2026-09-11 修正：拿掉動畫後卡片閃一下就消失/位置跑掉，就是這個
   原因)。拿掉動畫之後這裡自然回到瀏覽器預設(完全顯示、無位移)，
   :hover 才能正常接手控制 transform。 */
@keyframes homeCardIn {
  0%   { opacity: 0; transform: translateX(-28px); }
  100% { opacity: 1; transform: translateX(0); }
}
@keyframes homeBorderBreathe {
  0%, 100% { box-shadow: 0 0 6px 0px rgba(201,164,92,0.25); }
  50%      { box-shadow: 0 0 16px 3px rgba(201,164,92,0.55); }
}
.home-card:hover {
  transform: translateY(-4px) scale(1.045);
  box-shadow: 0 10px 28px rgba(0,0,0,0.45);
  /* 滑鼠移上去時把呼吸動畫整個關掉（不是 paused——暫停只是凍結在
     當下那一格，box-shadow 還是會被動畫卡住，蓋掉這裡想要的立體
     投影），這樣才能真的把 box-shadow 交還給這條 hover 規則自己控制
     (2026-09-11 修正)。滑鼠移開後 animation-name 恢復，呼吸繼續跑。 */
  animation-name: none;
}

.home-card::after {
  content: "";
  position: absolute; inset: 0;
  border: 2px solid transparent;
  background: linear-gradient(120deg, var(--accent-gold), var(--accent-teal), #c48be0, var(--accent-gold)) border-box;
  -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  background-size: 300% 300%;
  opacity: 0;
  transition: opacity 0.25s ease;
  animation: homeBorderShift 3s linear infinite paused;
}
.home-card:hover::after { opacity: 1; animation-play-state: running; }
@keyframes homeBorderShift { 0% { background-position: 0% 50%; } 100% { background-position: 300% 50%; } }

.home-card-shine {
  position: absolute;
  width: 70%; height: 180%;
  left: -25%; top: 55%;
  transform: rotate(-45deg);
  transform-origin: center;
  background: linear-gradient(90deg,
    transparent,
    rgba(255,120,140,0.55) 20%,
    rgba(255,210,120,0.6) 35%,
    rgba(255,255,255,0.85) 48%,
    rgba(140,255,210,0.6) 60%,
    rgba(140,180,255,0.6) 75%,
    transparent
  );
  mix-blend-mode: screen;
  opacity: 0;
  pointer-events: none;
}
.home-card:hover .home-card-shine { animation: homeShineSweep 1s linear forwards; }
@keyframes homeShineSweep {
  0%   { left: -25%; top: 55%;   opacity: 0.9; }
  88%  { left: 95%;  top: -125%; opacity: 0.9; }
  100% { left: 108%; top: -138%; opacity: 0; }
}

.home-card-ambient {
  position: absolute;
  border-radius: 50%;
  background: #fff;
  pointer-events: none;
  animation-name: homeAmbientBreathe;
  animation-timing-function: ease-in-out;
  animation-iteration-count: infinite;
}
@keyframes homeAmbientBreathe {
  0%, 100% { opacity: var(--min-o); transform: scale(0.85); }
  50%      { opacity: var(--max-o); transform: scale(1.15); }
}

.home-card-spark {
  position: absolute; width: 6px; height: 6px; border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 6px 2px rgba(255,255,255,0.95), 0 0 12px 4px var(--accent-gold);
  pointer-events: none;
  animation: homeSparkPop 0.65s ease-out forwards;
}
@keyframes homeSparkPop {
  0%   { opacity: 1; transform: scale(0.4) translate(0,0); }
  100% { opacity: 0; transform: scale(1.5) translate(var(--dx), var(--dy)); }
}
</style>
</head>
<body>
<div class="home-starfield" id="home-starfield"></div>
<div id="navbar-host"></div>

<header class="container page-header" id="home-header">
  <div class="page-eyebrow">Player Guide</div>
  <h1 id="site-title">新世界狂歡 | 關卡攻略筆記</h1>
  <p id="site-tagline">轉貼關卡攻略、角色簡易資料庫、關卡隊伍紀錄，方便照抄過往隊伍用✌️</p>
</header>

<main class="container" id="home-main">
  <div class="section" id="home-cards" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px;">
    <a class="btn btn-primary btn-block" style="padding:20px; flex-direction:column; align-items:flex-start; gap:4px;" href="stages.html">
      <strong style="font-size:1.05rem;">關卡攻略</strong>
      <span style="font-weight:400; font-size:0.85rem; opacity:0.85;">敵人資訊、流程攻略</span>
    </a>
    <a class="btn btn-block" style="padding:20px; flex-direction:column; align-items:flex-start; gap:4px;" href="cards.html">
      <strong style="font-size:1.05rem;">卡片資料庫</strong>
      <span style="font-weight:400; font-size:0.85rem; color:var(--text-dim);">多條件圖片式篩選</span>
    </a>
    <a class="btn btn-block" style="padding:20px; flex-direction:column; align-items:flex-start; gap:4px;" href="my-teams.html">
      <strong style="font-size:1.05rem;">我的隊伍</strong>
      <span style="font-weight:400; font-size:0.85rem; color:var(--text-dim);">跨關卡總覽，快速修改</span>
    </a>
  </div>
  <p id="mv-hidden-link-host" style="text-align:center; margin-top:18px; font-size:0.75rem;"></p>
</main>

<div id="footer-host"></div>

<script type="module">
import { mountNavbar, mountFooter } from './src/components/Navbar.js';
import { loadJSON, DataSources } from './src/core/dataLoader.js';
import { mountCoverImage } from './src/components/CardFace.js';
mountNavbar('index.html');
mountFooter();

// 星空背景 (2026-09-11) — 120 顆星星全部畫在同一個 div 的 box-shadow
// 清單裡，不是 120 個個別 DOM 元素，而且完全沒有動畫，畫一次之後不會
// 再重繪；只有 7 顆真的在呼吸發光，只動 opacity/transform，成本很低。
(function initStarfield() {
  const field = document.getElementById('home-starfield');
  if (!field) return;
  const dots = [];
  for (let i = 0; i < 120; i++) {
    const x = Math.random() * 100;
    const y = Math.random() * 100;
    const alpha = 0.25 + Math.random() * 0.45;
    dots.push(`calc(${x}vw) calc(${y}vh) 0 rgba(255,255,255,${alpha.toFixed(2)})`);
  }
  const dotsLayer = document.createElement('div');
  dotsLayer.style.position = 'absolute';
  dotsLayer.style.width = '1px';
  dotsLayer.style.height = '1px';
  dotsLayer.style.boxShadow = dots.join(',');
  field.appendChild(dotsLayer);
  for (let g = 0; g < 7; g++) {
    const star = document.createElement('div');
    star.className = 'home-glow-star';
    star.style.left = `${Math.random() * 100}vw`;
    star.style.top = `${Math.random() * 100}vh`;
    star.style.animationDelay = `${Math.random() * 4}s`;
    star.style.animationDuration = `${3 + Math.random() * 3}s`;
    field.appendChild(star);
  }
})();

function hexToRgba(hex, opacityPercent) {
  const h = (hex || '#100f18').replace('#', '');
  const r = parseInt(h.substring(0, 2), 16) || 0;
  const g = parseInt(h.substring(2, 4), 16) || 0;
  const b = parseInt(h.substring(4, 6), 16) || 0;
  const a = Math.max(0, Math.min(100, opacityPercent ?? 100)) / 100;
  return `rgba(${r}, ${g}, ${b}, ${a})`;
}
// 每個顏色點各自的位置 (2026-09-08) — 沒有 positions 陣列，或長度跟
// colors 對不上時（舊資料），退回平均分配。
function gradientStops(colors, positions) {
  if (!positions || positions.length !== colors.length) {
    return colors.map((c, i) => `${c} ${colors.length === 1 ? 0 : Math.round((i / (colors.length - 1)) * 100)}%`).join(', ');
  }
  return colors.map((c, i) => `${c} ${positions[i]}%`).join(', ');
}
function applyZoneBg(el, zone) {
  if (!zone) return;
  el.style.background = zone.gradientEnabled
    ? `linear-gradient(${zone.gradientAngle}deg, ${gradientStops(zone.gradientColors, zone.gradientPositions)})`
    : hexToRgba(zone.color, zone.opacity);
}
const CARD_LABELS = ['關卡攻略', '卡片資料庫', '我的隊伍'];
const CARD_LINKS = ['stages.html', 'cards.html', 'my-teams.html'];
const CARD_SUBTITLES = ['敵人資訊、流程攻略', '多條件圖片式篩選', '跨關卡總覽，快速修改'];

// data/site-settings.json is edited from the admin's 網站設定 page; fall
// back to the text already in the HTML (above) if the file is missing so
// a fresh repo without it yet still renders correctly.
loadJSON(DataSources.siteSettings).then((settings) => {
  if (settings.siteTitle) {
    document.getElementById('site-title').textContent = settings.siteTitle;
    document.title = `${settings.siteTitle} | 玩家攻略站`;
  }
  if (settings.siteTagline) {
    document.getElementById('site-tagline').textContent = settings.siteTagline;
  }

  // 隱藏連結到「版主的隊伍」(2026-09-09) — 不放進導覽列，顏色可以在
  // 「首頁外觀」自己調成接近背景色，達到「有連結但不顯眼」的效果；
  // 沒設定過顏色的話用一個本來就偏暗的預設值，不會太顯眼。
  const linkHost = document.getElementById('mv-hidden-link-host');
  if (linkHost) {
    const link = document.createElement('a');
    link.href = 'mod-teams.html';
    link.textContent = '·';
    link.style.color = settings.hiddenLinkColor || '#211f30';
    link.style.textDecoration = 'none';
    linkHost.appendChild(link);
  }

  const hp = settings.homepageStyle;
  if (!hp) return;

  applyZoneBg(document.getElementById('home-header'), hp.header);
  applyZoneBg(document.getElementById('home-main'), hp.main);

  const cardsHost = document.getElementById('home-cards');
  const cards = hp.cards || [];
  // Only replace the default text buttons if at least one card actually
  // has an image set — otherwise keep the plain text version above
  // rather than showing 3 empty image frames.
  if (!cards.some((c) => c && c.image)) return;

  cardsHost.innerHTML = '';
  cardsHost.style.gridTemplateColumns = 'repeat(auto-fit, minmax(200px, 1fr))';
  cards.forEach((c, i) => {
    if (!c) return;
    const eff = c.linkMode === 'follow' && cards[c.followIndex] ? cards[c.followIndex] : c;
    const a = document.createElement('a');
    a.className = 'home-card';
    a.href = CARD_LINKS[i];
    a.style.animationDelay = `${i * 0.09}s`;
    a.addEventListener('animationend', (e) => {
      if (e.animationName === 'homeCardIn') {
        a.style.animation = 'homeBorderBreathe 5s ease-in-out infinite';
      }
    });
    const [w, h] = (c.cropRatio || '2:3').split(':').map(Number);
    a.style.aspectRatio = `${w || 2} / ${h || 3}`;
    a.style.background = eff.bgGradientEnabled
      ? `linear-gradient(${eff.bgGradientAngle}deg, ${gradientStops(eff.bgGradientColors, eff.bgGradientPositions)})`
      : hexToRgba(eff.bgColor, eff.bgOpacity);
    a.style.borderWidth = `${eff.borderWidth}px`;
    a.style.borderStyle = 'solid';
    if (eff.borderGradientEnabled) {
      a.style.borderImage = `linear-gradient(${eff.borderGradientAngle}deg, ${gradientStops(eff.borderGradientColors, eff.borderGradientPositions)}) 1`;
    } else {
      a.style.borderColor = hexToRgba(eff.borderColor, eff.borderOpacity);
    }
    if (c.image) {
      const clip = document.createElement('div');
      clip.className = 'home-card-clip';
      a.appendChild(clip);
      mountCoverImage(clip, {
        imageSrc: c.image,
        imageAlt: CARD_LABELS[i],
        imageZoom: c.imageZoom,
        imageOffsetX: c.imageOffsetX,
        imageOffsetY: c.imageOffsetY,
      });
    }
    const overlay = document.createElement('div');
    overlay.className = 'home-card-overlay';
    overlay.innerHTML = `<strong>${CARD_LABELS[i]}</strong><span>${CARD_SUBTITLES[i]}</span>`;
    // 疊字底下的遮罩漸層可自訂顏色/範圍 (2026-09-08，後台「首頁外觀」
    // 每張圖各自的「文字底色遮罩」) — 永遠是這張自己的設定，不受
    // 顏色/邊框的獨立/跟隨影響，圖片沒設定過時用預設黑色 75%→0%。
    const overlayColor = c.overlayColor || '#000000';
    const overlayStops = (c.overlayStops && c.overlayStops.length ? c.overlayStops : [{ position: 0, opacity: 75 }, { position: 100, opacity: 0 }])
      .slice().sort((s1, s2) => s1.position - s2.position);
    overlay.style.background = `linear-gradient(to top, ${overlayStops.map((s) => `${hexToRgba(overlayColor, s.opacity)} ${s.position}%`).join(', ')})`;
    a.appendChild(overlay);

    const shine = document.createElement('div');
    shine.className = 'home-card-shine';
    a.appendChild(shine);

    // 角落常駐光點 (2026-09-11) — 每張卡 3~5 顆，落在角落附近一小塊
    // 隨機範圍內（不是卡死在正角落本身），大小/亮度/呼吸節奏各自隨機，
    // 刻意不要四顆一模一樣、不要同步，才不會看起來像機械式貼上去的
    // 裝飾。
    const ambientCount = 3 + Math.floor(Math.random() * 3);
    const ambientCorners = [[0, 0], [1, 0], [0, 1], [1, 1]];
    for (let s = 0; s < ambientCount; s++) {
      const corner = ambientCorners[s % ambientCorners.length];
      const jitter = 22;
      const baseInset = 10 + Math.random() * 14;
      const dot = document.createElement('div');
      dot.className = 'home-card-ambient';
      const size = 2 + Math.random() * 3;
      dot.style.width = `${size}px`;
      dot.style.height = `${size}px`;
      if (corner[0] === 0) dot.style.left = `${baseInset + Math.random() * jitter}px`;
      else dot.style.right = `${baseInset + Math.random() * jitter}px`;
      if (corner[1] === 0) dot.style.top = `${baseInset + Math.random() * jitter}px`;
      else dot.style.bottom = `${baseInset + Math.random() * jitter}px`;
      dot.style.setProperty('--min-o', `${(0.15 + Math.random() * 0.15).toFixed(2)}`);
      dot.style.setProperty('--max-o', `${(0.55 + Math.random() * 0.35).toFixed(2)}`);
      dot.style.animationDuration = `${(3 + Math.random() * 3.5).toFixed(2)}s`;
      dot.style.animationDelay = `${(Math.random() * 4).toFixed(2)}s`;
      const glow = 3 + Math.random() * 5;
      dot.style.boxShadow = `0 0 ${glow}px 1px rgba(255,255,255,0.9), 0 0 ${glow * 2}px 2px rgba(201,164,92,0.5)`;
      a.appendChild(dot);
    }

    // 點擊時角落散發細碎光點，短暫延遲一下再真的跳轉，不然頁面切換
    // 太快，動畫根本來不及被看到 (2026-09-11)。
    a.addEventListener('click', (e) => {
      e.preventDefault();
      const rect = a.getBoundingClientRect();
      const inset = 12;
      const corners = [
        [inset, inset], [rect.width - inset, inset],
        [inset, rect.height - inset], [rect.width - inset, rect.height - inset],
      ];
      corners.forEach((pos, idx) => {
        const spark = document.createElement('div');
        spark.className = 'home-card-spark';
        spark.style.left = `${pos[0]}px`;
        spark.style.top = `${pos[1]}px`;
        const dx = (pos[0] < rect.width / 2 ? -1 : 1) * (12 + Math.random() * 8);
        const dy = (pos[1] < rect.height / 2 ? -1 : 1) * (12 + Math.random() * 8);
        spark.style.setProperty('--dx', `${dx}px`);
        spark.style.setProperty('--dy', `${dy}px`);
        spark.style.animationDelay = `${idx * 0.03}s`;
        a.appendChild(spark);
      });
      setTimeout(() => { window.location.href = a.href; }, 180);
    });

    cardsHost.appendChild(a);
  });
}).catch(() => {});
</script>
</body>
</html>
